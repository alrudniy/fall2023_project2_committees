<html>
    <style>body[data-theme='light'] {
        background-color: #ffffff;

    body[data-theme='dark'] {

        color: #ffffff;
    }</style>
<link rel="stylesheet" href="../static/homeP.css">

    <h1>Welcome, Professors!</h1>

    <form method="post" action="/seeHistoryButtonP">
        <input id='history' type="submit" value="See History" name="/seeHistoryButtonP">

        // Apply theme based on stored preference or default to light mode

        document.body.setAttribute("data-theme", storedTheme);
    </script>
