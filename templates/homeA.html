<!DOCTYPE html>
<html>
<head>
    <title>Administrator Home Page</title>
    
    <label class="switch">
        <input type="checkbox" id="themeToggle">
        <span class="slider"></span>
    </label>

    <span id="themeLabel">Dark Theme</span>

    <style>
        body {
            font-family: Arial, sans-serif;
            transition: background-color 0.5s, color 0.5s;
        }
    
        /* Default light mode styles */
        body[data-theme='light'] {
            background-color: #ffffff;
            color: #000000;
        }
    
        body[data-theme='dark'] {
            background-color: #121212;
            color: #ffffff;
        }
        
        #themeLabel {
        position: fixed;
        left: 80px;   /* adjust based on the width of the switch to place it right next to the switch */
        bottom: 20px; /* adjust this value to vertically align it with the middle of the switch */
        font-size: 16px;
        transition: color 0.3s;
        }

        body[data-theme='light'] #themeLabel {
            color: #000000;
        }

        body[data-theme='dark'] #themeLabel {
            color: #ffffff;
        }

        .switch {
            position: fixed;
            left: 10px;
            bottom: 10px;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #007BFF;
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }
    </style>

</head>
<body>

<h1>Administrator Home Page</h1>

    <!-- (Optional) Add line 48 if you want the toggle button on this page too -->
    <!-- Delete line 48 if you dont want the toggle button on this page -->
    <!--<button class="theme-toggle" onclick="toggleTheme()">Toggle Dark Mode</button> -->

    <script>
    document.getElementById("themeToggle").addEventListener('change', function() {
        let labelElement = document.getElementById("themeLabel");
        if(this.checked) {
            document.body.setAttribute("data-theme", "dark");
            localStorage.setItem("theme", "dark");
            labelElement.textContent = "Light Theme";  // Change label to "Light Theme" when dark mode is on
        } else {
            document.body.setAttribute("data-theme", "light");
            localStorage.setItem("theme", "light");
            labelElement.textContent = "Dark Theme";  // Change label back to "Dark Theme" when dark mode is off
        }
    });

    // Apply theme based on stored preference or default to light mode
    let storedTheme = localStorage.getItem("theme") || "light";
        document.body.setAttribute("data-theme", storedTheme);
    if (storedTheme === "dark") {
        document.getElementById("themeToggle").checked = true;
        document.getElementById("themeLabel").textContent = "Light Theme";
    }
    </script>

</body>
</html>
