<!DOCTYPE html>
<html>
<head>
    <style>
                
         /* Default light mode styles */
        body[data-theme='light'] {
            background-color: #ffffff;
            color: #000000;
        }
        
        body[data-theme='dark'] {
            background-color: #121212;
            color: #ffffff;
        }
                
    </style>
</head>
<body>
    <form method="post" action="/settingsButtonA">
        <input type="submit" value="Settings" name="/settingsButtonA"/>
    </form>
    <h1>Administrator Home Page</h1>
    <form method="post" action="/seeHistoryButtonA">
        <input type="submit" value="See History" name="/seeHistoryButtonA"/>
    </form>
    <form method="post" action="/applyButtonA">
        <input type="submit" value="Apply" name="/applyButtonA"/>

    <script>
        // Apply theme based on stored preference or default to light mode
        let storedTheme = localStorage.getItem("theme") || "light";
        document.body.setAttribute("data-theme", storedTheme);
    </script>

</body>
</html>
