<!DOCTYPE html>
<html>
<head>
    <title>Home Page</title>

    <style>
        /* ... other styles ... */

        .switch {
            position: fixed;
            left: 10px;
            bottom: 10px;
            display: inline-block;
            width: 60px; /* Width of the outer part of the switch */
            height: 34px; /* Height of the outer part of the switch */
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 26px; /* Height of the inner circle of the switch */
            width: 26px; /* Width of the inner circle of the switch */
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #2196F3; /* Blue background when toggled on */
        }

        input:checked + .slider:before {
            transform: translateX(26px); /* Adjust as necessary for the width of the switch */
        }

        /* ... other styles ... */
    </style>
</head>
<body>
    <!-- ... rest of the body ... -->

    <!-- Toggle Switch -->
    <label class="switch">
        <input type="checkbox" id="themeToggle">
        <span class="slider"></span>
    </label>

    <span id="themeLabel">Dark Theme</span>

    <!-- ... script ... -->

</body>
</html>
